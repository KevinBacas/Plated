name: PR CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check PR whitespace
        run: git diff --check HEAD^1 HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Lint application
        run: npm run lint

      - name: Build web PWA
        run: npm run build:web

      - name: Verify PWA output
        run: |
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/sw.js
